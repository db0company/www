<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Distribution des Artistes</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@900');
      @font-face {
          font-family: 'Archivo SemiExpanded';
          src: url(Archivo_SemiExpanded-Thin.ttf);
          font-weight: normal;
      }
      @font-face {
          font-family: 'Archivo SemiExpanded';
          src: url(Archivo_SemiExpanded-Bold.ttf);
          font-weight: bold;
      }
      body {
          font-family: 'Archivo SemiExpanded', sans-serif;
          font-weight: normal;
          margin: 0;
          padding: 0;
          font-size: 24px;
      }
      main {
          width: 1160px;
          margin: auto;
          background: white;
      }
      textarea, input[type="text"], input[type="number"], select {
          width: 100%;
          margin-bottom: 10px;
          padding: 10px;
          box-sizing: border-box;
          font-family: inherit;
          font-size: inherit;
      }
      button {
          padding: 10px 20px;
          font-size: inherit;
          cursor: pointer;
      }

      /* New controls styling */
      .control-group {
          margin-bottom: 15px;
      }
      .radio-group, .checkbox-group {
          display: flex;
          gap: 20px;
          margin-bottom: 10px;
      }
      .radio-group label, .checkbox-group label {
          display: flex;
          align-items: center;
          gap: 5px;
          cursor: pointer;
      }
      input[type="radio"], input[type="checkbox"] {
          width: auto;
          margin: 0;
          transform: scale(1.2);
      }
    </style>
</head>
<body>
  <main>
    <h1>Distribution des Artistes</h1>
    <p>Entrez les artistes, un par ligne :</p>
    <textarea id="artists" rows="10"></textarea>

    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="uppercase" checked>
            Majuscules (Uppercase)
        </label>
    </div>

    <p>Séparateur :</p>
    <input type="text" id="separator" value="✦">

    <div class="control-group">
        <p>Mode de distribution :</p>
        <div class="radio-group">
            <label>
                <input type="radio" name="dist_mode" value="per_line" checked>
                Artistes par ligne
            </label>
            <label>
                <input type="radio" name="dist_mode" value="num_lines">
                Nombre de lignes
            </label>
        </div>
    </div>

    <p id="count_label">Quantité :</p>
    <input type="number" id="count_val" value="2">

    <p>Type de tri :</p>
    <select id="sort">
        <option value="0">Haut (Pyramide inversée)</option>
        <option value="1">Bas (Pyramide)</option>
        <option value="2" selected>Symétrique</option>
        <option value="3">Aléatoire</option>
        <option disabled>---</option>
        <option value="4">Alphabétique</option>
        <option value="5">Garder l'ordre</option>
    </select>

    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="add_spaces">
            Ajouter des espaces (Justifier les lignes)
        </label>
    </div>

    <button id="distribute">Distribuer les Artistes</button>

    <h2>Résultat :</h2>
    <textarea id="result" rows="15"></textarea>
    <br><br><br><br>
  </main>

    <script>
        $(document).ready(function() {
            // Character width table
            const charWidths = {
                " ": 0.328, "!": 0.381, "\"": 0.475, "#": 0.655, "$": 0.655, "%": 1.069,
                "&": 0.9, "'": 0.347, "(": 0.414, ")": 0.414, "*": 0.555, "+": 0.713,
                ",": 0.328, "-": 0.414, ".": 0.328, "/": 0.346, "0": 0.655, "1": 0.655,
                "2": 0.655, "3": 0.655, "4": 0.655, "5": 0.655, "6": 0.655, "7": 0.655,
                "8": 0.655, "9": 0.655, ":": 0.346, ";": 0.346, "<": 0.713, "=": 0.713,
                ">": 0.713, "?": 0.619, "@": 1.201, "A": 0.864, "B": 0.829, "C": 0.862,
                "D": 0.897, "E": 0.793, "F": 0.724, "G": 0.931, "H": 0.897, "I": 0.381,
                "J": 0.55, "K": 0.864, "L": 0.726, "M": 1.071, "N": 0.897, "O": 0.931,
                "P": 0.758, "Q": 0.931, "R": 0.862, "S": 0.758, "T": 0.759, "U": 0.897,
                "V": 0.864, "W": 1.173, "X": 0.864, "Y": 0.864, "Z": 0.759, "[": 0.381,
                "\\": 0.346, "]": 0.381, "^": 0.583, "_": 0.655, "`": 0.347, "a": 0.619,
                "b": 0.655, "c": 0.585, "d": 0.655, "e": 0.619, "f": 0.381, "g": 0.655,
                "h": 0.655, "i": 0.312, "j": 0.312, "k": 0.621, "l": 0.312, "m": 1.0,
                "n": 0.655, "o": 0.655, "p": 0.655, "q": 0.655, "r": 0.414, "s": 0.55,
                "t": 0.346, "u": 0.655, "v": 0.621, "w": 0.897, "x": 0.621, "y": 0.621,
                "z": 0.585, "{": 0.509, "|": 0.285, "}": 0.509, "~": 0.698
            };

            function getWidth(str) {
                let w = 0;
                for (let char of str) {
                    w += charWidths[char] || 0.655;
                }
                return w;
            }

            $('input[name="dist_mode"]').on('change', function() {
                if ($(this).val() === 'per_line') {
                    $('#count_label').text('Artistes par ligne :');
                } else {
                    $('#count_label').text('Nombre de lignes :');
                }
                saveToLocalStorage();
            });

            function saveToLocalStorage() {
                localStorage.setItem('artists', $('#artists').val());
                localStorage.setItem('separator', $('#separator').val());
                localStorage.setItem('count_val', $('#count_val').val());
                localStorage.setItem('sort', $('#sort').val());
                localStorage.setItem('dist_mode', $('input[name="dist_mode"]:checked').val());
                localStorage.setItem('uppercase', $('#uppercase').is(':checked'));
                localStorage.setItem('add_spaces', $('#add_spaces').is(':checked'));
            }

            function loadFromLocalStorage() {
                $('#artists').val(localStorage.getItem('artists') || '');
                $('#separator').val(localStorage.getItem('separator') || '✦');
                $('#count_val').val(localStorage.getItem('count_val') || 2);
                $('#sort').val(localStorage.getItem('sort') || 2);

                const savedMode = localStorage.getItem('dist_mode') || 'per_line';
                $(`input[name="dist_mode"][value="${savedMode}"]`).prop('checked', true).trigger('change');

                const isUppercase = localStorage.getItem('uppercase') !== 'false';
                $('#uppercase').prop('checked', isUppercase);

                const addSpaces = localStorage.getItem('add_spaces') === 'true';
                $('#add_spaces').prop('checked', addSpaces);
            }

            function distributeArtists(artistsData, countVal, mode, sortType) {
                let processed = artistsData.slice();
                const isSequential = (sortType === 4 || sortType === 5);

                if (sortType === 4) { // Alpha
                    processed.sort((a, b) => a.name.localeCompare(b.name));
                } else if (!isSequential) {
                    // For balanced sorts (0-3), sort by WIDTH descending
                    processed.sort((a, b) => b.width - a.width);
                }

                const total = processed.length;
                let numLines, perLineTarget;

                // Calculate number of lines needed
                if (mode === 'per_line') {
                    perLineTarget = countVal;
                    numLines = Math.ceil(total / perLineTarget);
                } else {
                    numLines = countVal;
                    // For count-based fallback
                    perLineTarget = Math.ceil(total / numLines);
                }
                if (numLines < 1) numLines = 1;

                let lines = Array.from({ length: numLines }, () => []);

                if (isSequential) {
                    // --- SEQUENTIAL LOGIC (Alpha / Keep Order) ---
                    if (mode === 'per_line') {
                        // Strict Count Mode: Just chunks of N
                        let currentLine = 0;
                        for (let i = 0; i < total; i += perLineTarget) {
                            lines[currentLine++] = processed.slice(i, i + perLineTarget);
                        }
                    } else {
                        // "Number of Lines" Mode: Balanced Widths
                        // Calculate Ideal Width
                        const totalWidth = processed.reduce((sum, item) => sum + item.width, 0);
                        const targetWidth = totalWidth / numLines;

                        let currentLine = 0;
                        let currentLineW = 0;

                        for (let i = 0; i < total; i++) {
                            const item = processed[i];
                            const itemsRemaining = total - i;
                            const linesRemaining = numLines - 1 - currentLine;

                            // If we MUST start a new line to have enough lines for remaining items
                            // (e.g. 2 items left, 2 lines left -> must split now)
                            let mustSplit = (itemsRemaining <= linesRemaining);

                            // If we SHOULD split because current line is getting full
                            // Check if adding item puts us "past the halfway point" to the next line
                            // i.e. is (Current + Item) significantly farther from Target than (Current)?
                            let shouldSplit = false;
                            if (!mustSplit && currentLine < numLines - 1) {
                                if (currentLineW > 0 && (currentLineW + (item.width / 2)) > targetWidth) {
                                    shouldSplit = true;
                                }
                            }

                            if (mustSplit || shouldSplit) {
                                currentLine++;
                                currentLineW = 0;
                            }

                            // Safety check for index bounds (rare edge cases)
                            if (currentLine >= numLines) currentLine = numLines - 1;

                            lines[currentLine].push(item);
                            currentLineW += item.width;
                        }
                    }
                } else {
                    // --- BALANCED LOGIC (Shape Sorts: Top, Bottom, Sym) ---
                    // Greedy Bin Packing
                    const lineLengths = Array(numLines).fill(0);
                    processed.forEach(item => {
                        const minIndex = lineLengths.indexOf(Math.min(...lineLengths));
                        lines[minIndex].push(item);
                        lineLengths[minIndex] += item.width;
                    });
                }

                return lines.filter(l => l.length > 0);
            }

            function sortLinesSymmetrically(lines) {
                const linesWithWidth = lines.map(line => {
                    return {
                        content: line,
                        width: line.reduce((sum, item) => sum + item.width, 0)
                    };
                });

                linesWithWidth.sort((a, b) => a.width - b.width);

                const result = Array(linesWithWidth.length);
                let left = 0, right = linesWithWidth.length - 1;

                linesWithWidth.forEach((obj, i) => {
                    if (i % 2 === 0) {
                        result[left++] = obj.content;
                    } else {
                        result[right--] = obj.content;
                    }
                });
                return result;
            }

            function randomizeArray(array) {
                return array.sort(() => Math.random() - 0.5);
            }

            function main() {
                const rawInput = $('#artists').val().trim();
                if(!rawInput) return;

                const doUppercase = $('#uppercase').is(':checked');
                const addSpaces = $('#add_spaces').is(':checked');
                const rawLines = rawInput.split('\n').filter(a => a.trim() !== '');

                const artistsData = rawLines.map(str => {
                    const finalStr = doUppercase ? str.toUpperCase() : str;
                    return {
                        name: finalStr.trim(),
                        width: getWidth(finalStr.trim())
                    };
                });

                const countVal = parseInt($('#count_val').val(), 10);
                const sortType = parseInt($('#sort').val(), 10);
                const mode = $('input[name="dist_mode"]:checked').val();

                let lineGroups = distributeArtists(artistsData, countVal, mode, sortType);

                if (sortType <= 3) {
                     lineGroups = lineGroups.map(line => randomizeArray(line));
                }

                if (sortType <= 3) {
                    const getLineW = (line) => line.reduce((s, i) => s + i.width, 0);
                    switch (sortType) {
                        case 0: lineGroups.sort((a, b) => getLineW(b) - getLineW(a)); break;
                        case 1: lineGroups.sort((a, b) => getLineW(a) - getLineW(b)); break;
                        case 2: lineGroups = sortLinesSymmetrically(lineGroups); break;
                        case 3: lineGroups = randomizeArray(lineGroups); break;
                    }
                }

                const sepText = $('#separator').val();
                const separatorBase = ' ' + sepText + ' ';
                const sepWidth = getWidth(separatorBase);
                const spaceWidth = charWidths[" "];

                let lineStats = lineGroups.map(line => {
                    const textWidth = line.reduce((sum, item) => sum + item.width, 0);
                    const gaps = Math.max(0, line.length - 1);
                    const totalWidth = textWidth + (gaps * sepWidth);
                    return { line, totalWidth, gaps };
                });

                const maxLineWidth = Math.max(...lineStats.map(s => s.totalWidth));

                const finalOutputLines = lineStats.map(stat => {
                    const { line, totalWidth, gaps } = stat;

                    if (!addSpaces || gaps === 0 || totalWidth >= maxLineWidth) {
                        return line.map(i => i.name).join(separatorBase);
                    }

                    const widthDiff = maxLineWidth - totalWidth;
                    const spacesNeeded = Math.max(0, Math.round(widthDiff / spaceWidth));

                    const baseSpacesPerGap = Math.floor(spacesNeeded / gaps);
                    let extraSpaces = spacesNeeded % gaps;

                    let resultStr = "";
                    line.forEach((item, index) => {
                        resultStr += item.name;
                        if (index < line.length - 1) {
                            let spacesToAdd = baseSpacesPerGap;
                            if (extraSpaces > 0) {
                                spacesToAdd++;
                                extraSpaces--;
                            }

                            const leftSp = Math.floor(spacesToAdd / 2);
                            const rightSp = spacesToAdd - leftSp;
                            const leftPad = " ".repeat(leftSp);
                            const rightPad = " ".repeat(rightSp);

                            resultStr += " " + leftPad + sepText + rightPad + " ";
                        }
                    });
                    return resultStr;
                });

                $('#result').val(finalOutputLines.join('\n'));
            }

            loadFromLocalStorage();

            $('#artists, #separator, #count_val, #sort, #uppercase, #add_spaces').on('input change', saveToLocalStorage);
            $('input[name="dist_mode"]').on('change', main);
            $('#distribute').on('click', main);
        });
        </script>
</body>
</html>
